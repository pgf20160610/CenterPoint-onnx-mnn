# ============================================================
# CenterPoint 单样本推理配置（KITTI 格式样例 data/）
# 与 config_cpp.yaml 的区别：point_dim=4（KITTI 无 time_lag），
# 并填好了相机可视化所需的 image/calib/label 路径。
# 注意：models/ 中的是 Waymo 模型，在 KITTI 数据上检测精度有限，
#       本配置主要用于打通“点云+相机”读取、推理与可视化流程。
# ============================================================

point_cloud:
  x_min: -74.88
  x_max: 74.88
  y_min: -74.88
  y_max: 74.88
  z_min: -2.0
  z_max: 4.0
  x_step: 0.32
  y_step: 0.32
  point_dim: 4            # KITTI: x, y, z, intensity

pillar:
  max_pillars: 32000
  max_points_per_pillar: 20
  feature_num: 10
  pfe_output_dim: 64

bev:
  width: 468
  height: 468

postprocess:
  out_size_factor: 1.0
  score_threshold: 0.3
  nms_threshold: 0.7
  input_nms_max_size: 4096
  output_nms_max_size: 500
  output_h: 468
  output_w: 468

rpn_output_names:
  reg: "246"
  height: "250"
  dim: "264"
  rot: "258"
  score: "265"
  cls: "266"

model:
  backend: onnx
  pfe_path: models/pfe_baseline32000.onnx
  rpn_path: models/rpn_baseline.onnx

runtime:
  use_cuda: true
  num_threads: 4
  save_viz: true

io:
  data_dir: data
  save_dir: output/sample

# ---- 可视化（KITTI 标定 + BEV 风格，参考 PointPillars_ONNX_MNN_CPP）----
visualization:
  image_path: data/sample.png
  calib_path: data/sample_calib.txt
  label_path: data/sample_label.txt
  show_gt: true
  # BEV 渲染风格
  class_names: ["Vehicle", "Pedestrian", "Cyclist"]   # 类别 id -> 名称（Waymo 顺序）
  bev_view: forward-up           # forward-up | forward-down | left-up | right-up
  bev_width: 1786
  bev_height: 1122
  reference_style: true          # 白底 + 图例 + 传感器坐标轴
  x_range: [0.0, 70.4]           # BEV 渲染范围（米），独立于模型栅格范围
  y_range: [-40.0, 40.0]
