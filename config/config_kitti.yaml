# ============================================================
# CenterPoint C++ / Python inference configuration — KITTI
# Used by: centerpoint executable (src/main.cpp) with --config config/config_kitti.yaml
#          tools/infer_onnx.py with --config config/config_kitti.yaml
# ============================================================

# ---- point cloud range & BEV grid resolution ----
# KITTI LiDAR: front-facing FOV, 4-dim points (x, y, z, intensity)
point_cloud:
  x_min: 0.0
  x_max: 69.12
  y_min: -39.68
  y_max: 39.68
  z_min: -3.0
  z_max: 1.0
  x_step: 0.16
  y_step: 0.16
  point_dim: 4            # x, y, z, intensity  (no time_lag for KITTI)

# ---- pillar feature encoder ----
pillar:
  max_pillars: 12000
  max_points_per_pillar: 100
  feature_num: 9          # 4-dim input + 3 cluster offsets + 2 pillar-center offsets
  pfe_output_dim: 64

# ---- BEV feature map size (scatter output) ----
# W = (x_max - x_min) / x_step = 69.12 / 0.16 = 432
# H = (y_max - y_min) / y_step = 79.36 / 0.16 = 496
bev:
  width: 432
  height: 496

# ---- detection head decode + NMS ----
postprocess:
  out_size_factor: 1.0
  score_threshold: 0.3
  nms_threshold: 0.5
  input_nms_max_size: 500
  output_nms_max_size: 83
  output_h: 496
  output_w: 432

# ---- RPN output tensor names ----
# These names are set by export_onnx_kitti.py via output_names; verify with:
#   python -c "import onnxruntime as ort; s=ort.InferenceSession('models/kitti_rpn.onnx'); [print(o.name) for o in s.get_outputs()]"
rpn_output_names:
  reg: "reg"
  height: "height"
  dim: "dim"
  rot: "rot"
  score: "score"
  cls: "cls"

# ---- model backend & paths ----
model:
  backend: onnx
  pfe_path: models/kitti_pfe.onnx
  rpn_path: models/kitti_rpn.onnx

# ---- runtime options ----
runtime:
  use_cuda: true
  num_threads: 4
  save_viz: true

# ---- input / output ----
io:
  data_dir: lidars
  save_dir: output/kitti
